{% extends "base.html" %}


{% block titulo %}
    Nova tarefa
{% endblock %}


{% block conteudo %}

    <h2>Nova tarefa</h2>

    <form
        method="POST"
        class="formulario"
    >

        <label>
            Título:
        </label>

        <input
            type="text"
            name="titulo"
            required
        >


        <label>
            Responsável:
        </label>

        <select
            name="usuario_id"
            required
        >

            {% for usuario in usuarios %}

                <option value="{{ usuario.id }}">
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>


        <button type="submit">
            Cadastrar
        </button>

    </form>

{% endblock %}
