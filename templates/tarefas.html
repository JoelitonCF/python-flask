{% extends "base.html" %}


{% block titulo %}
Tarefas
{% endblock %}


{% block conteudo %}

<h2>Tarefas</h2>

<a href="{{ url_for('tarefas.cadastrar') }}" class="botao botao-novo">
    Nova tarefa
</a>

<br><br>

<table class="tabela">

    <thead>
        <tr>
            <th>ID</th>
            <th>Tarefa</th>
            <th>Responsável</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>

        {% for tarefa in tarefas %}

        <tr>
            <td>{{ tarefa.id }}</td>

            <td>
                {{ tarefa.titulo }}
            </td>

            <td>
                {{ tarefa.usuario_nome }}
            </td>

            <td>

                <a href="{{ url_for('tarefas.editar', id=tarefa.id) }}" class="botao botao-editar">
                    Editar
                </a>


                <form action="{{ url_for('tarefas.excluir', id=tarefa.id) }}" method="POST" class="form-excluir"
                    onsubmit="return confirm('Deseja realmente excluir esta tarefa?')">

                    <button type="submit" class="botao botao-excluir">
                        Excluir
                    </button>

                </form>

            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
