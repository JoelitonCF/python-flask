{% extends "base.html" %}

{% block titulo %}
Login
{% endblock titulo %}

{% block conteudo %}


<h2>Login</h2>

<form method="POST" class="formulario">

    <label>Email:</label>
    <input type="text" name="email" required>
    <br><br>
    <label>Senha:</label>
    <input type="password" name="senha" required>
    <br><br>
    <button type="submit" class="botao botao-novo">Entrar</button>


</form>

{% endblock conteudo %}
