{% extends "base.html" %}


{% block titulo %}

    Criar conta

{% endblock %}


{% block conteudo %}
    <h2>Criar conta</h2>
    <form method="POST" class="formulario">
        <label>Nome: </label>
        <input type="text" name="nome" required>
        <br><br>
        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>
        <label>Senha:</label>
        <input type="password" name="senha" required>
        <br><br>
        <button type="submit" class="botao-novo">Criar conta</button>

    </form>
{% endblock %}
