{% extends "base.html" %}

{% block titulo %}
Cadastro
{% endblock titulo %}

{% block conteudo %}

<h2>Cadastro de usuário</h2>

<form method="POST" class="formulario">

    <label>Nome:</label>
    <input type="text" name="nome" required>

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" min="1" required>

    <br><br>

    <label>Idade:</label>
    <input type="number" name="idade" min="1" required>

    <br><br>

    <label>Cidade:</label>
    <input type="text" name="cidade" required>

    <br><br>

    <button type="submit" class="botao botao-novo">Cadastrar</button>

</form>



{% endblock conteudo %}
